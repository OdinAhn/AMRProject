name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build

  # 35단계: 배포 이미지가 PR마다 실제로 빌드되는지 확인한다(푸시는 하지 않음). 테스트는 build job이 이미 돌린다.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t amr-backend:ci .

      - name: Build frontend image
        run: docker build -t amr-frontend:ci frontend

  # 43단계: VDA 5050 가상 로봇(Python) 로직 단위 테스트 — 브로커·서버 없이 돈다.
  virtual-robot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/virtual-robot
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Compile scripts
        run: python -m py_compile virtual_robot.py seed.py task.py

  # 28단계: 프론트엔드도 PR마다 타입 검사(tsc -b)·빌드·lint를 돌린다. 자동화된 화면 테스트는 없다(AGENTS.md 참고).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
