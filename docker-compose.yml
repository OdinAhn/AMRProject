services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: amr_project
      MYSQL_USER: amr
      MYSQL_PASSWORD: amr
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - amr_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amr_mysql_data:
