spring:
  application:
    name: AMRProject

app:
  token:
    secret: ${TOKEN_SIGNING_SECRET:}
    expiry-minutes: ${TOKEN_EXPIRY_MINUTES:480}
  external:
    # 26단계: 비어 있으면 /api/external/** 요청은 전부 401 (fail-closed)
    api-key: ${EXTERNAL_API_KEY:}
  bootstrap:
    admin:
      # 26단계: 둘 다 설정돼 있고 ADMIN 사용자가 없을 때만 최초 관리자를 만든다
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
