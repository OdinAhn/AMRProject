spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:amr_project}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:amr}
    password: ${DB_PASSWORD:amr}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  token:
    secret: ${TOKEN_SIGNING_SECRET:local-dev-only-secret-change-me}
  external:
    api-key: ${EXTERNAL_API_KEY:local-dev-only-external-api-key}
  robot-gateway:
    mqtt:
      enabled: ${ROBOT_GATEWAY_MQTT_ENABLED:false}
      broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
      manufacturer: ${MQTT_MANUFACTURER:AMRProject}
  # 29단계: 기본값(application.yaml)은 꺼져 있고 local에서만 켠다 — 테스트 스위트는 자동 배정·연결 판정이 끼어들면 안 된다.
  dispatch:
    auto:
      enabled: ${AUTO_DISPATCH_ENABLED:true}
      interval-ms: ${AUTO_DISPATCH_INTERVAL_MS:5000}
  robot:
    connection-monitor:
      enabled: ${ROBOT_CONNECTION_MONITOR_ENABLED:true}
    heartbeat-timeout-seconds: ${ROBOT_HEARTBEAT_TIMEOUT_SECONDS:30}

logging:
  level:
    org.hibernate.SQL: debug
